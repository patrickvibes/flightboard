# Jekyll config for the public Flight Board site (GitHub Pages).
# Source of truth lives in the private repo under site/; the release workflow
# copies it to patrickvibes/flightboard together with docs/ and the firmware.
title: Flight Board
description: Live aircraft overhead, on a tiny ESP32 board and in your browser.
baseurl: /flightboard
permalink: pretty          # pages at /install/ not /install.html (boards link to /update/)
url: https://patrickvibes.github.io

remote_theme: just-the-docs/just-the-docs@v0.12.0
plugins:
  - jekyll-remote-theme
  - jekyll-relative-links

color_scheme: dark
search_enabled: true
aux_links:
  "Install": "/flightboard/install/"
  "Changelog": "/flightboard/changelog/"
footer_content: "Flight Board · data from the <a href='https://opensky-network.org'>OpenSky Network</a>"

relative_links:
  enabled: true
  collections: false

exclude:
  - README.md
  - CHANGELOG.md
