# Runs in the PUBLIC repo (patrickvibes/flightboard). When the private repo's
# release workflow pushes a vX.Y.Z tag here, publish a GitHub Release with the
# firmware files and that version's changelog section.
name: GitHub Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          VER="${TAG#v}"
          awk -v v="$VER" '
            $0 ~ "^## \\[" v "\\]" {on=1; next}
            on && /^## \[/ {exit}
            on {print}' CHANGELOG.md > notes.md
          {
            echo
            echo "**Install or update:** https://patrickvibes.github.io/flightboard/install/"
          } >> notes.md
          gh release create "$TAG" firmware/"$VER"/*.bin \
            --title "Flight Board $VER" --notes-file notes.md --verify-tag
